</style>

  {name:'浙大',full:'浙江大学',      r:75, svg:'zju.svg',    color:'#1abc9c', dim:0.00},

/* ================= 昵称 & 排行榜 ================= */
/* 云端排行榜最终架构:
   写入: POST ntfy.sh(免费、无配额、CORS 全开放)
   读取: GitHub Pages scores.json(极稳) + ntfy 实时流(可选,超时忽略)
   同步: GitHub Actions 每 5 分钟把 ntfy 新成绩合并进 scores.json 永久保存 */
var NTFY='https://ntfy.sh/hcbd-lb-mmadi0abu2nm';
var API_FALLBACK='scores.json?t='+Date.now();
var NICK_KEY='hcbd_nick';
var DEV_KEY='hcbd_dev';
var NICK_A=['快乐的','努力的','佛系的','爱睡觉的','北大路的','未名湖的','博雅塔的','图书馆的','燕园的','自习的','卷王的','摸鱼的','干饭的','冲刺的','散步的','爬山的','熬夜的','早八的','刷题的','抢座的','图书馆占座的','未名湖畔的','博雅塔下的','食堂排队的','静园草坪的','三角地的','跑校园的','刷夜的','追剧的','听讲座的','做实验的','写论文的','答辩的','保研的','考研的','出国的','社团的','合唱的','辩论的','羽毛球的','夜跑的','晨读的','干饭第一名的','摸鱼冠军的','做梦的','发呆的','喝茶的','咖啡续命的','奶茶续命的','自习室常驻的','凌晨的','期末周的','开学季的','毕业季的','军训的','体测的','刷绩点的','转专业的','辅修的'];
var NICK_B=['猫','鱼','鸭','熊','兔','鹿','狐','鲸','雁','鹰','松鼠','企鹅','熊猫','海豚','考拉','河马','猫头鹰','柴犬','柯基','布偶猫','橘猫','狸花猫','边牧','哈士奇','金毛','萨摩耶','比熊','仓鼠','刺猬','水獭','鸽子','麻雀','喜鹊','锦鲤','小龙虾','章鱼','海星','北极熊','大熊猫','树懒','袋鼠','考拉熊','羊驼','小鹿','白鲸','海豚','乌龟','青蛙','蝴蝶','蜻蜓','萤火虫','小燕子','大雁','孔雀','丹顶鹤','火烈鸟','天鹅','企鹅宝宝','海豹','海狮','水母','贝壳','河豚','鲨鱼','鲸鱼','狮子','老虎','猎豹','雪豹','狐狸','浣熊','刺豚','寄居蟹','小螃蟹'];

function getNick(){return localStorage.getItem(NICK_KEY)||'';}
function setNick(n){n=String(n||'').replace(/\s+/g,' ').trim().slice(0,12);if(n)localStorage.setItem(NICK_KEY,n);return n;}
function getDevice(){
  var d=localStorage.getItem(DEV_KEY);
  if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem(DEV_KEY,d);}
  return d;
}
function randNick(){
  var n=NICK_A[Math.floor(Math.random()*NICK_A.length)]+NICK_B[Math.floor(Math.random()*NICK_B.length)];
  return n.slice(0,8);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function fmtTime(ts){
  var d=new Date(ts),p=function(n){return (n<10?'0':'')+n;};
  return p(d.getHours())+':'+p(d.getMinutes());
}

var dev=getDevice();
var nick=getNick();
var pendingRank=0, rankTotal=0, scoreSubmitted=false;
var lbBusy=false, lbTimer=null;

var nickWrap=document.getElementById('nickWrap');
var nickInput=document.getElementById('nickInput');
var lbWrap=document.getElementById('lbWrap');
var themeWrap=document.getElementById('themeWrap');
var themeList=document.getElementById('themeList');

var nickModalMode='start'; /* 'start'=首次起名, 'edit'=修改昵称 */
function openNickModal(mode){
  nickModalMode=mode||(started?'edit':'start');

    if(sub) sub.textContent='新昵称会在你下一次上传成绩时生效,历史成绩保持不变。';

  }else{
    if(title) title.textContent='🏆 起个昵称,上榜冲分!';
    if(sub) sub.textContent='游戏结束后,你的得分会自动上传到实时排行榜,和其他玩家一起 PK 排名。';

  }

  setTimeout(function(){try{nickInput.focus();}catch(e){}},60);
}
function saveNickAndStart(){
  var v=nickInput.value.replace(/\s+/g,' ').trim().slice(0,12);
  if(!v)v=randNick();
  setNick(v); nick=v;
  nickWrap.classList.add('hidden');
  if(nickModalMode!=='edit'&&!started&&!over){started=true;lastDrop=Date.now()-DROP_CD+100;}
}
document.getElementById('nickOk').addEventListener('click',saveNickAndStart);
document.getElementById('nickRandom').addEventListener('click',function(){

function toggleLB(){

/* 背景主题切换 */
function buildThemeList(){
  var cur=getTheme();

  for(var i=0;i<THEMES.length;i++){

    html+='<div class="themeOpt'+(th.id===cur?' active':'')+'" data-id="'+th.id+'">'

themeList.addEventListener('click',function(e){

function renderLB(scores){
  var list=document.getElementById('lbList');
  var hint=document.getElementById('lbHint');
  if(!scores||!scores.length){
    hint.textContent='加载失败,请检查网络后重试';
    list.innerHTML='<div class="empty">暂无数据<br>游戏结束后成绩会自动上传</div>';
    return;
  }
  hint.textContent='全网 '+scores.length+' 条成绩 · 每 30 秒自动刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  var medals=['🥇','🥈','🥉'];
  var html='';
  for(var i=0;i<scores.length;i++){
    var s=scores[i], me=(s.dev===dev);
    var rk=i<3?medals[i]:String(i+1);
    html+='<div class="row'+(me?' me':'')+'" title="'+esc(new Date(s.ts).toLocaleString('zh-CN',{hour12:false}))+'">'
      +'<span class="rk">'+rk+'</span>'
      +'<span class="nm">'+esc(s.name)+(me?'<i>我</i>':'')+'</span>'
      +'<span class="t">'+fmtTime(s.ts)+'</span>'
      +'<span class="sc">'+s.score+'</span>'
      +'</div>';
  }
  list.innerHTML=html;
}

/* 带超时的 fetch */
function fetchT(url,opts,ms){
  ms=ms||12000;
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  if(ctrl) opts=Object.assign({},opts,{signal:ctrl.signal});
  var timer=ctrl?setTimeout(function(){ctrl.abort();},ms):null;
  return fetch(url,opts).then(function(r){if(timer)clearTimeout(timer);return r;},
    function(e){if(timer)clearTimeout(timer);throw e;});
}

/* 读取: GitHub scores.json(极稳);SSE 实时流按需启用(网络差时自动失效) */
var liveScores=[];
function startNtfyStream(){
  try{
    var es=new EventSource(NTFY+'/json?since=all&poll=1');
    es.onmessage=function(ev){
      try{
        var m=JSON.parse(ev.data);
        if(m&&m.event==='message'&&m.message){
          var s=JSON.parse(m.message);
          if(s&&s.name&&(s.score|0)>0){
            liveScores.push({name:s.name,score:s.score,dev:s.dev,ts:s.ts||(m.time*1000)});
          }
        }
      }catch(e){}
    };
    es.onerror=function(){try{es.close();}catch(e){}};
  }catch(e){}
}

function loadLeaderboard(){
  fetchT(API_FALLBACK,{cache:'no-store'},6000).then(function(r){return r.json();}).then(function(data){
    var scores=Array.isArray(data)?data:((data&&Array.isArray(data.scores))?data.scores:[]);
    /* 合并 SSE 实时流里的新成绩,按设备去重(每设备保留最高分) */
    var bestByDev={};
    var list=scores.concat(liveScores);
    for(var i=0;i<list.length;i++){
      var s=list[i];
      if(!s||!s.name||(s.score|0)<=0) continue;
      var d=s.dev||'anon';
      if(!bestByDev[d]||bestByDev[d].score<(s.score|0)) bestByDev[d]=s;
    }
    var merged=[];
    for(var k in bestByDev) merged.push(bestByDev[k]);
    merged.sort(function(a,b){return (b.score-a.score)||((a.ts||0)-(b.ts||0));});
    merged=merged.slice(0,50);
    renderLB(merged);
    var myBest=0,myRank=0;
    for(var i=0;i<merged.length;i++){
      if(merged[i].dev===dev&&merged[i].score>myBest){myBest=merged[i].score;myRank=i+1;}
    }
    document.getElementById('lbFoot').textContent=myBest
      ?('我的最高分: '+myBest+' · 全网第 '+myRank+' 名')
      :'还没有你的成绩,上榜冲分吧!';
  }).catch(function(){
    renderLB(null);
  });
}

/* 写入: POST ntfy(无配额、无认证、CORS 全开放),同步 GitHub 由 Actions 兜底。
   写入成功后立即加入本机 liveScores,玩家马上看到自己的成绩。 */
function submitScore(){
  if(DEMO) return; /* 演示模式不污染真实排行榜 */
  if(scoreSubmitted||score<=0)return;
  scoreSubmitted=true;
  var entry={name:nick,score:score,dev:dev,ts:Date.now()};
  var showLocal=function(){
    /* 去重: 同一设备只保留最高分的一条实时记录 */
    for(var i=0;i<liveScores.length;i++){
      if(liveScores[i].dev===dev){
        if(liveScores[i].score<entry.score) liveScores[i]=entry;
        setTimeout(loadLeaderboard,500);
        return;
      }
    }
    liveScores.push(entry);
    setTimeout(loadLeaderboard,500);
  };
  /* ntfy POST,重试3次 */
  var tryNtfy=function(n){
    if(n<=0)return;

var engine=Engine.create({gravity:{x:0,y:GRAVITY}});

World.add(world,Bodies.rectangle(GL-WL/2,(GT+GB)/2,WL,GB-GT+200,

World.add(world,Bodies.rectangle(GR+WR/2,(GT+GB)/2,WR,GB-GT+200,

World.add(world,Bodies.rectangle(W/2,GB+WB/2,GW+WL*2,WB,

var score=0, best=+localStorage.getItem('hcbd_hi')||0;
var cur=rndT(), nxt=rndT();
var aimX=W/2, canDrop=true, lastDrop=0;
var started=false, over=false;
var balls=[], parts=[];
var shkT=0, shkI=0;
var maxReached=0;
var dangerTimer=0, dangerNear=false;
var mergeQueue=[];
/* 合成北大庆祝效果 */
var celebrateT=0;      /* >0 表示庆祝中,倒计时 ms */
var celebrateAt=null;  /* 合成位置 {x,y} */
var confetti=[];       /* 彩带粒子 */
var wonCount=0;        /* 本局合成北大次数 */

function rndT(){
  if(DEMO){
    /* 演示模式: 等级分布 0:0, 1-8:0, 9-10 各 25%, 11 50% */
    var r=Math.random();
    if(r<0.5) return 11;      /* 清华 */
    if(r<0.75) return 10;     /* 中科 */
    if(r<0.9) return 9;       /* 浙大 */
    return 8;                 /* 上交 */
  }
  return Math.floor(Math.random()*SPAWN_COUNT);
}

Events.on(engine,'collisionStart',function(ev){
  for(var i=0;i<ev.pairs.length;i++){
    var a=ev.pairs[i].bodyA, b=ev.pairs[i].bodyB;
    if(a.plugin.tier!==undefined && b.plugin.tier!==undefined
       && a.plugin.tier===b.plugin.tier && a.plugin.tier<MT
       && !a.plugin.merging && !b.plugin.merging){
      a.plugin.merging=true; b.plugin.merging=true;
      mergeQueue.push({a:a,b:b});
    }
  }
});

function processQueue(){
  for(var i=0;i<mergeQueue.length;i++){
    var p=mergeQueue[i];
    if(!p.a.plugin.alive||!p.b.plugin.alive) continue;
    if(p.a.plugin.tier!==p.b.plugin.tier) continue;
    var tier=p.a.plugin.tier;
    if(tier>=MT) continue;
    var nt=tier+1;
    var mx=(p.a.position.x+p.b.position.x)/2;
    var my=(p.a.position.y+p.b.position.y)/2;
    World.remove(world,p.a); World.remove(world,p.b);
    p.a.plugin.alive=false; p.b.plugin.alive=false;
    rmBall(p.a); rmBall(p.b);
    spawn(mx,my,nt);
    score+=(nt+1)*10;
    if(nt>maxReached) maxReached=nt;
    boom(mx,my,TIERS[nt].color,14);
    if(nt===MT){
      boom(mx,my,'#fbbf24',50);boom(mx,my,'#ef4444',35);
      /* 🎉 合成北大: 触发隆重庆祝效果 */
      celebrateT=4000;
      celebrateAt={x:mx,y:my};
      wonCount++;
      spawnConfetti(mx,my);
    }
    else{shkT=100;shkI=Math.min((nt+1)*1.2,6);}
  }
  mergeQueue=[];
}

function rmBall(b){for(var i=0;i<balls.length;i++) if(balls[i].body===b){balls.splice(i,1);return;}}

function spawn(x,y,t){
  var d=TIERS[t];
  var b=Bodies.circle(x,y,d.r,{
    restitution:RESTITUTION,friction:FRICTION,frictionAir:DAMP,
    density:0.0015,label:'ball',
    plugin:{tier:t,alive:true,merging:false}
  });
  World.add(world,b);
  balls.push({body:b,tier:t,born:Date.now()});
  return b;
}

function boom(x,y,c,n){
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n+Math.random()*.4, s=2+Math.random()*4;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
      life:1,dc:.018+Math.random()*.02,c:c,sz:2+Math.random()*4});
  }
}
/* 彩带/焰火粒子: 从合成点向外喷发,带重力与旋转 */
function spawnConfetti(x,y){
  var colors=['#fbbf24','#f59e0b','#ef4444','#dc2626','#f97316','#fde047','#facc15','#fb923c','#fca5a5','#fcd34d','#fff7ed'];
  for(var i=0;i<160;i++){
    var a=Math.random()*Math.PI*2;
    var sp=3+Math.random()*9;
    var c=colors[(Math.random()*colors.length)|0];
    var life=1+Math.random()*1.2;
    confetti.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-4-Math.random()*3,
      g:0.16+Math.random()*0.08,
      life:life, maxLife:life,
      c:c,
      w:4+Math.random()*5, h:7+Math.random()*6,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.35,
      shape:Math.random()<0.5?'rect':'circle',
      r:2+Math.random()*3
    });
  }
}
function tickConfetti(dt){
  var step=dt/16.7;
  for(var i=confetti.length-1;i>=0;i--){
    var p=confetti[i];
    p.x+=p.vx*step; p.y+=p.vy*step;
    p.vy+=p.g*step;
    p.vx*=0.985;
    p.life-=0.006*step;
    p.rot+=p.vr*step;
    if(p.life<=0) confetti.splice(i,1);
  }
}
function tickParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=p.dc;
    if(p.life<=0) parts.splice(i,1);
  }
}

function drop(){
  if(!canDrop||over||!started) return;
  var now=Date.now(); if(now-lastDrop<DROP_CD) return;
  var r=TIERS[cur].r;
  var x=Math.max(GL+r+4,Math.min(GR-r-4,aimX));
  spawn(x,GT+r+4,cur);
  lastDrop=now; canDrop=false;
  setTimeout(function(){
    if(!over){cur=nxt;nxt=rndT();canDrop=true;}
  },DROP_CD);
}

/* 演示模式: 自动播放,持续瞄准落点 */
if(DEMO){
  setInterval(function(){
    if(!started||over) return;
    /* 扫描一个空隙列,投到最左边或最右边,让同级球尽量相邻 */
    var best=-1,bestGap=-1;
    for(var col=0;col<3;col++){
      var cx=GL+30+(GR-GL-60)*col/2;
      var maxY=GT;
      for(var i=0;i<balls.length;i++){
        var b=balls[i];
        if(Math.abs(b.body.position.x-cx)<TIERS[b.tier].r+8){
          if(b.body.position.y>maxY) maxY=b.body.position.y;
        }
      }
      var gap=(GB-maxY);
      if(gap>bestGap){bestGap=gap;best=cx;}
    }
    if(best>0) aimX=best;
    drop();
  },460);
}

function toCanvasX(cx){var rc=cv.getBoundingClientRect();return(cx-rc.left)/rc.width*W;}
function toCanvasY(cy){var rc=cv.getBoundingClientRect();return(cy-rc.top)/rc.height*H;}

function inLbBtn(cx,cy){return cx>=W-48&&cx<=W-4&&cy>=6&&cy<=34;}
function inNickBtn(cx,cy){return cx>=W-48&&cx<=W-4&&cy>=40&&cy<=68;}
function inThemeBtn(cx,cy){return cx>=W-48&&cx<=W-4&&cy>=74&&cy<=102;}
function inNickEdit(cx,cy){return cx>W/2-110&&cx<W/2+110&&cy>H/2+50&&cy<H/2+80;}

cv.addEventListener('mousemove',function(e){aimX=toCanvasX(e.clientX);});
cv.addEventListener('click',function(e){
  var cx=toCanvasX(e.clientX), cy=toCanvasY(e.clientY);
  if(inLbBtn(cx,cy)){toggleLB();return;}
  if(inNickBtn(cx,cy)){openNickModal('edit');return;}

    if(inNickEdit(cx,cy)){openNickModal('start');return;}
    started=true;lastDrop=Date.now()-DROP_CD+100;return;
  }
  if(over){checkRestart(e.clientX,e.clientY);return;}
  drop();
});
cv.addEventListener('touchstart',function(e){
  e.preventDefault(); aimX=toCanvasX(e.touches[0].clientX);
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault(); aimX=toCanvasX(e.touches[0].clientX);
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  var t=e.changedTouches[0];
  var cx=toCanvasX(t.clientX), cy=toCanvasY(t.clientY);

    if(inNickEdit(cx,cy)){openNickModal('start');return;}
    started=true;lastDrop=Date.now()-DROP_CD+100;return;
  }
  if(over){checkRestart(t.clientX,t.clientY);return;}

},{passive:false});

function checkRestart(cx,cy){
  var mx=toCanvasX(cx), my=toCanvasY(cy);
  if(mx>W/2-55&&mx<W/2+55&&my>H/2+74&&my<H/2+112) doRestart();
}

function doRestart(){
  for(var i=0;i<balls.length;i++) World.remove(world,balls[i].body);
  balls=[]; parts=[]; mergeQueue=[];
  score=0; over=false; canDrop=true; lastDrop=Date.now();
  cur=rndT(); nxt=rndT(); maxReached=0;
  started=true; dangerTimer=0; dangerNear=false;
  scoreSubmitted=false; pendingRank=0;
  celebrateT=0; celebrateAt=null; confetti=[]; wonCount=0;
}

function update(dt){
  if(over) return;
  Engine.update(engine,dt);
  processQueue();
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    if(!b.body.plugin.alive){balls.splice(i,1);continue;}
    if(b.body.position.y>GB+200||b.body.position.x<-200||b.body.position.x>W+200){
      World.remove(world,b.body); balls.splice(i,1);
    }
  }
  dangerNear=false;
  var now=Date.now();
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(now-b.born<720) continue;
    var vx=b.body.velocity.x, vy=b.body.velocity.y;
    var spd=Math.sqrt(vx*vx+vy*vy);
    if(spd<0.5){
      if(b.body.position.y-TIERS[b.tier].r<DANGER_Y){
        dangerNear=true; break;
      }
    }
  }
  if(dangerNear){
    dangerTimer+=dt;
    if(dangerTimer>=DANGER_DELAY){
      over=true;
      if(score>best){best=score;localStorage.setItem('hcbd_hi',best);}
      submitScore();
    }
  }else{
    dangerTimer=Math.max(0,dangerTimer-dt*2);
  }
  tickParts();
  tickConfetti(dt);
  if(celebrateT>0){
    celebrateT-=dt;
    if(celebrateT<=0){celebrateT=0;celebrateAt=null;confetti=[];}
  }
  if(shkT>0) shkT-=dt;
}

function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function lighten(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+((255-r)*pct/100|0));
  g=Math.min(255,g+((255-g)*pct/100|0));
  b=Math.min(255,b+((255-b)*pct/100|0));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}
function darken(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-(r*pct/100|0));
  g=Math.max(0,g-(g*pct/100|0));
  b=Math.max(0,b-(b*pct/100|0));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function drawBall(c,x,y,ti,sc,al){
  var d=TIERS[ti], r=d.r*(sc||1);
  c.save(); c.globalAlpha=al==null?1:al;
  c.beginPath();c.arc(x+2,y+3,r,0,Math.PI*2);
  c.fillStyle='rgba(0,0,0,.10)';c.fill();

  var img=ASSETS[ti];
  if(img && img.complete && img.naturalWidth>0){
    c.save();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();
    c.drawImage(img,x-r,y-r,r*2,r*2);
    /* 亮度校正: 叠加半透明暗色,统一各校徽视觉亮度 */
    if(d.dim>0){
      c.fillStyle='rgba(0,0,0,'+d.dim+')';
      c.fillRect(x-r,y-r,r*2,r*2);
    }
    c.restore();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);
    c.strokeStyle=d.color;c.lineWidth=2.5;c.stroke();
  }else{
    var g=c.createRadialGradient(x-r*.3,y-r*.3,r*.05,x,y,r);
    g.addColorStop(0,lighten(d.color,30));g.addColorStop(1,d.color);
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=g;c.fill();
    c.strokeStyle=darken(d.color,20);c.lineWidth=2;c.stroke();
    c.fillStyle='#fff';
    c.font='bold '+Math.max(r*.65,10)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    c.textAlign='center';c.textBaseline='middle';
    c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=2;
    c.fillText(d.name,x,y+1);
    c.shadowColor='transparent';
  }
  c.restore();
}

function render(c){
  c.save();
  if(shkT>0) c.translate((Math.random()-.5)*shkI*2,(Math.random()-.5)*shkI*2);

  var th=currentTheme();
  /* 背景渐变 */
  var bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,th.top);bg.addColorStop(0.5,th.mid);bg.addColorStop(1,th.bot);
  c.fillStyle=bg; c.fillRect(0,0,W,H);
  /* 夜空主题: 星星 */
  if(th.id==='night'){
    c.fillStyle='rgba(255,255,255,.7)';
    for(var si=0;si<40;si++){
      var sx=(si*73+40)%W, sy=(si*131+20)%(GB-40);
      var tw=0.4+(si%3)*0.3;
      c.globalAlpha=tw*(0.6+0.4*Math.sin(Date.now()/600+si));
      c.fillRect(sx,sy,1.5,1.5);
    }
    c.globalAlpha=1;
  }
  /* 樱花主题: 飘落花瓣(简化) */
  if(th.id==='pink'){
    c.fillStyle='rgba(244,114,182,.5)';
    for(var pi=0;pi<18;pi++){
      var px=(pi*97+60)%W, py=(pi*151+Date.now()/18)%H;
      c.beginPath();c.arc(px,py,2.5,0,Math.PI*2);c.fill();
    }
  }

  c.fillStyle=th.board;
  c.fillRect(GL,GT,GW,GB-GT);
  c.strokeStyle=th.line;c.lineWidth=1;
  for(var y=GT;y<GB;y+=22){c.beginPath();c.moveTo(GL,y);c.lineTo(GR,y);c.stroke();}

  c.save();c.setLineDash([6,4]);
  c.strokeStyle=dangerNear?'rgba(239,68,68,.8)':'rgba(239,68,68,.4)';
  c.lineWidth=dangerNear?2:1.5;
  c.beginPath();c.moveTo(GL,DANGER_Y);c.lineTo(GR,DANGER_Y);c.stroke();c.setLineDash([]);
  c.fillStyle=dangerNear?'rgba(239,68,68,.8)':'rgba(239,68,68,.45)';
  c.font='10px sans-serif';c.textAlign='left';c.textBaseline='bottom';
  c.fillText('\u26A0 \u5371\u9669\u7EBF',GL+4,DANGER_Y-2);
  if(dangerNear && dangerTimer>0){
    var tw=(dangerTimer/DANGER_DELAY)*(GR-GL-20);
    c.fillStyle='rgba(239,68,68,.3)';
    c.fillRect(GL+10,DANGER_Y+4,tw,4);
  }
  c.restore();

  var wg=c.createLinearGradient(0,GT,0,GB);
  wg.addColorStop(0,'#60a5fa');wg.addColorStop(1,'#2563eb');
  c.fillStyle=wg;
  c.fillRect(0,GT-4,WL+2,GB-GT+WB+8);
  c.fillRect(GR-1,GT-4,WR+2,GB-GT+WB+8);
  c.fillRect(GL-2,GB,GW+4,WB+4);
  c.fillStyle='rgba(255,255,255,.18)';
  c.fillRect(GL-1,GT,2,GB-GT);
  c.fillRect(GR-1,GT,2,GB-GT);
  c.fillStyle='rgba(0,0,0,.08)';
  c.fillRect(0,GT-4,2,GB-GT+WB+8);
  c.fillRect(W-2,GT-4,2,GB-GT+WB+8);
  c.fillRect(0,GB+WB+2,W,2);

  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(!b.body.plugin.alive) continue;
    drawBall(c,b.body.position.x,b.body.position.y,b.tier);
  }

  for(var i=0;i<parts.length;i++){
    var p=parts[i]; c.globalAlpha=p.life; c.fillStyle=p.c;
    c.beginPath();c.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);c.fill();
  }
  c.globalAlpha=1;

  /* 彩带绘制 */
  for(var j=0;j<confetti.length;j++){
    var cf=confetti[j];
    c.save();
    c.globalAlpha=Math.min(1,cf.life);
    c.translate(cf.x,cf.y);
    c.rotate(cf.rot);
    c.fillStyle=cf.c;
    if(cf.shape==='rect'){
      c.fillRect(-cf.w/2,-cf.h/2,cf.w,cf.h);
    }else{
      c.beginPath();c.arc(0,0,cf.r,0,Math.PI*2);c.fill();
    }
    c.restore();
  }
  c.globalAlpha=1;

  /* 合成北大的庆祝效果 */
  if(celebrateT>0 && celebrateAt){
    var t=celebrateT/4000;               /* 1 → 0 */
    var prog=1-t;                        /* 0 → 1 已播放进度 */
    var cx=celebrateAt.x, cy=celebrateAt.y;
    /* 全屏金色光芒(淡入淡出) */
    var glowAlpha=Math.min(1,t*2)*0.35*(1-prog*0.6);
    var rg=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H));
    rg.addColorStop(0,'rgba(251,191,36,'+glowAlpha+')');
    rg.addColorStop(0.5,'rgba(251,191,36,'+(glowAlpha*0.5)+')');
    rg.addColorStop(1,'rgba(251,191,36,0)');
    c.fillStyle=rg;
    c.fillRect(0,0,W,H);
    /* 中心光晕脉冲 */
    var haloR=60+Math.sin(prog*Math.PI*4)*12;
    var hg=c.createRadialGradient(cx,cy,0,cx,cy,haloR);
    hg.addColorStop(0,'rgba(255,255,255,'+(0.7*t)+')');
    hg.addColorStop(1,'rgba(251,191,36,0)');
    c.fillStyle=hg;
    c.beginPath();c.arc(cx,cy,haloR,0,Math.PI*2);c.fill();
    /* 🏆 北大! 大字(缩放弹出) */
    var scale=prog<0.2 ? 0.5+prog/0.2*0.7 : 1.2-((prog-0.2)/0.8)*0.2;
    var txtAlpha=Math.min(1,t*1.5);
    c.save();
    c.translate(cx,Math.max(cy-90,GT+60));
    c.scale(scale,scale);
    c.globalAlpha=txtAlpha;
    c.textAlign='center';c.textBaseline='middle';
    c.font='bold 64px "PingFang SC","Microsoft YaHei",sans-serif';
    c.lineWidth=8;c.strokeStyle='#b45309';
    c.strokeText('\uD83C\uDFC6',0,-40);
    c.fillStyle='#f59e0b';
    c.fillText('\uD83C\uDFC6',0,-40);
    c.font='bold 40px "PingFang SC","Microsoft YaHei",sans-serif';
    c.lineWidth=6;c.strokeStyle='#b45309';
    c.strokeText('\u5317\u5927\uFF01',0,10);
    c.fillStyle='#fff';
    c.fillText('\u5317\u5927\uFF01',0,10);
    c.font='bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillStyle='#7c2d12';
    c.fillText('\u606D\u559C\u5408\u6210\u5317\u4EAC\u5927\u5B66\uFF01',0,38);
    c.restore();
  }

  if(canDrop&&!over&&started){
    var d=TIERS[cur], px=Math.max(GL+d.r+4,Math.min(GR-d.r-4,aimX));
    c.save();c.setLineDash([4,4]);c.strokeStyle='rgba(100,116,139,.25)';c.lineWidth=1;
    c.beginPath();c.moveTo(px,GT);c.lineTo(px,GB);c.stroke();c.setLineDash([]);c.restore();
    drawBall(c,px,GT+d.r+4,cur,1,.5);
    c.fillStyle='rgba(100,116,139,.45)';
    c.beginPath();c.moveTo(px-7,GT-1);c.lineTo(px+7,GT-1);c.lineTo(px,GT+9);c.closePath();c.fill();
  }

  c.fillStyle='#1e293b';c.font='bold 22px sans-serif';c.textAlign='left';c.textBaseline='top';
  c.fillText('\u5F97\u5206: '+score,12,8);
  c.fillStyle='#64748b';c.font='13px sans-serif';
  c.fillText('\u6700\u9AD8: '+best,12,34);
  c.fillStyle='#94a3b8';c.font='11px sans-serif';c.textAlign='right';
  c.fillText('\u5408\u6210\u76EE\u6807 \u2192 \u5317\u5927',W-58,8);
  c.fillStyle=TIERS[cur].color;c.font='bold 13px sans-serif';
  c.fillText('\u5F53\u524D: '+TIERS[cur].full,W-58,24);

  /* 排行榜按钮 */
  c.fillStyle='rgba(255,255,255,.88)';rr(c,W-48,6,44,28,14);c.fill();
  c.strokeStyle='rgba(100,116,139,.3)';c.lineWidth=1;rr(c,W-48,6,44,28,14);c.stroke();
  c.fillStyle='#1e293b';c.font='12px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('\uD83C\uDFC6 \u699C',W-26,21);

  /* 改昵称按钮(游戏过程中常驻) */
  c.fillStyle='rgba(255,255,255,.88)';rr(c,W-48,40,44,28,14);c.fill();
  c.strokeStyle='rgba(100,116,139,.3)';c.lineWidth=1;rr(c,W-48,40,44,28,14);c.stroke();
  c.fillStyle='#1e293b';c.font='12px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('\u270F\uFE0F \u540D',W-26,55);

  /* 背景切换按钮 */
  c.fillStyle='rgba(255,255,255,.88)';rr(c,W-48,74,44,28,14);c.fill();
  c.strokeStyle='rgba(100,116,139,.3)';c.lineWidth=1;rr(c,W-48,74,44,28,14);c.stroke();
  c.fillStyle='#1e293b';c.font='11px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('\uD83C\uDF3F \u80CC\u666F',W-26,89);

  c.fillStyle='#475569';c.font='12px sans-serif';c.textAlign='left';c.textBaseline='middle';
  c.fillText('\u4E0B\u4E00\u4E2A:',12,54);
  drawBall(c,72,54,nxt,.45,1);

  var bx=110,by=H-38,bw=W-bx-12,bh=14;
  c.fillStyle='rgba(0,0,0,.06)';rr(c,bx,by,bw,bh,7);c.fill();
  var prog=Math.min(score/2000,1);
  if(prog>0){c.fillStyle='rgba(96,165,250,.5)';rr(c,bx,by,bw*prog,bh,7);c.fill();}
  for(var i=0;i<TIERS.length;i++){
    var tx=bx+bw*(i/(TIERS.length-1));
    c.beginPath();c.arc(tx,by+bh/2,3,0,Math.PI*2);
    c.fillStyle=i<=maxReached?TIERS[i].color:'#cbd5e1';c.fill();
    c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
  }

  if(!started){
    c.fillStyle='rgba(255,255,255,.92)';rr(c,35,H/2-140,W-70,280,18);c.fill();
    c.strokeStyle='rgba(0,0,0,.06)';c.lineWidth=1;rr(c,35,H/2-140,W-70,280,18);c.stroke();
    c.fillStyle='#1e293b';c.font='bold 36px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('\u5408\u6210\u5317\u5927',W/2,H/2-90);
    c.fillStyle='#64748b';c.font='15px sans-serif';
    c.fillText('\u79FB\u52A8\u7784\u51C6 \u00B7 \u70B9\u51FB\u6295\u63B7',W/2,H/2-45);
    c.fillText('\u76F8\u540C\u5B66\u6821\u78B0\u649E\u5373\u5408\u6210\u5347\u7EA7',W/2,H/2-20);
    c.fillText('12\u4E2A\u7B49\u7EA7 \u00B7 \u771F\u5B9E\u6821\u5FBD',W/2,H/2+5);
    var py=H/2+40;
    var startX=W/2-(TIERS.length-1)*14;
    for(var i=0;i<TIERS.length;i++) drawBall(c,startX+i*28,py,i,.35,1);
    c.fillStyle='#64748b';c.font='13px sans-serif';
    c.fillText('\u6635\u79F0: '+nick+' \u00B7 \u70B9\u51FB\u4FEE\u6539',W/2,H/2+62);
    c.fillStyle='#3b82f6';c.font='bold 17px sans-serif';
    c.fillText('\u70B9\u51FB\u5F00\u59CB',W/2,H/2+95);
  }

  if(over){
    c.fillStyle='rgba(15,23,42,.72)';c.fillRect(GL,GT,GW,GB-GT);
    c.fillStyle='rgba(255,255,255,.95)';rr(c,55,H/2-125,W-110,260,16);c.fill();
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='#ef4444';c.font='bold 26px sans-serif';
    c.fillText('\u6E38\u620F\u7ED3\u675F',W/2,H/2-82);
    c.fillStyle='#334155';c.font='bold 22px sans-serif';
    c.fillText('\u5F97\u5206: '+score,W/2,H/2-45);
    if(score>=best&&score>0){
      c.fillStyle='#f59e0b';c.font='bold 15px sans-serif';
      c.fillText('\uD83C\uDFC6 \u65B0\u7EAA\u5F55\uFF01',W/2,H/2-16);
    }else{
      c.fillStyle='#64748b';c.font='14px sans-serif';
      c.fillText('\u6700\u9AD8: '+best,W/2,H/2-16);
    }
    /* 最大合成学校(始终显示,带校徽) */
    var maxTier=maxReached>0?maxReached:0;
    var md=TIERS[maxTier];
    c.fillStyle='#475569';c.font='12px sans-serif';
    c.fillText('\u672C\u5C40\u6700\u5927\u5408\u6210',W/2,H/2+10);
    /* 画小校徽 */
    var iconR=16;
    var iconImg=ASSETS[maxTier];
    if(iconImg && iconImg.complete && iconImg.naturalWidth>0){
      c.save();
      c.beginPath();c.arc(W/2-52,H/2+30,iconR,0,Math.PI*2);c.clip();
      c.drawImage(iconImg,W/2-52-iconR,H/2+30-iconR,iconR*2,iconR*2);
      if(md.dim>0){
        c.fillStyle='rgba(0,0,0,'+md.dim+')';
        c.fillRect(W/2-52-iconR,H/2+30-iconR,iconR*2,iconR*2);
      }
      c.restore();
      c.beginPath();c.arc(W/2-52,H/2+30,iconR,0,Math.PI*2);
      c.strokeStyle=md.color;c.lineWidth=2;c.stroke();
    }else{
      c.fillStyle=md.color;
      c.beginPath();c.arc(W/2-52,H/2+30,iconR,0,Math.PI*2);c.fill();
      c.fillStyle='#fff';c.font='bold 12px sans-serif';
      c.fillText(md.name,W/2-52,H/2+31);
    }
    c.fillStyle='#1e293b';c.font='bold 15px sans-serif';
    c.fillText(md.full,W/2+8,H/2+30);
    if(pendingRank>0){
      c.fillStyle='#0284c7';c.font='bold 14px sans-serif';
      c.fillText('\u5168\u7F51\u6392\u540D: \u7B2C '+pendingRank+' \u540D / '+rankTotal+' \u4EBA',W/2,H/2+58);
    }else if(score>0){
      c.fillStyle='#94a3b8';c.font='13px sans-serif';
      c.fillText('\u6210\u7EE9\u4E0A\u4F20\u4E2D\u2026',W/2,H/2+58);
    }
    c.fillStyle='#3b82f6';rr(c,W/2-55,H/2+74,110,38,10);c.fill();
    c.fillStyle='#fff';c.font='bold 15px sans-serif';
    c.fillText('\u518D\u6765\u4E00\u6B21',W/2,H/2+93);
  }

  c.restore();
}

var lastT=performance.now();
function loop(t){
  if(loopRunning) return;
  loopRunning = true;
  var dt=Math.min(t-lastT,32); lastT=t;
  update(dt); render(ctx);
  loopRunning = false;
  if(document.hidden) {
    setTimeout(function(){ loop(performance.now()); }, 16);
  } else {
    requestAnimationFrame(loop);
  }
}
var loopRunning = false;
if(document.hidden) {
  setTimeout(function(){ loop(performance.now()); }, 16);
} else {
  requestAnimationFrame(loop);
}

loadLeaderboard();
if(!getNick()) setTimeout(function(){openNickModal('start');},400);

/* 初始化背景主题 */
(function(){
  var th=currentTheme();
  document.body.style.background=th.css;
})();

})();
</script>
</body>
</html>
