<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#7dd3fc">
<title>合成北大 · 实时排行榜</title>
<script src="assets/matter.min.js"></script>
<script>window.Matter||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#e0f2fe 0%,#bae6fd 50%,#7dd3fc 100%);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none}
canvas{display:block;max-width:100vw;max-height:100vh;cursor:pointer;touch-action:none;
  border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.12)}

.overlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background:rgba(15,23,42,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.hidden{display:none!important}
.card{background:#fff;border-radius:18px;padding:22px;width:min(90vw,330px);
  box-shadow:0 24px 64px rgba(0,0,0,.28);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.card h2{margin:0 0 6px;font-size:19px;color:#1e293b}
.card .sub{font-size:12.5px;color:#64748b;margin-bottom:14px;line-height:1.6}
#nickInput{width:100%;padding:10px 12px;font-size:15px;border:1.5px solid #cbd5e1;border-radius:10px;
  outline:none;user-select:text;-webkit-user-select:text;font-family:inherit}
#nickInput:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow button{flex:1;padding:10px 0;font-size:14px;border:none;border-radius:10px;cursor:pointer;
  background:#e2e8f0;color:#334155;font-weight:600;font-family:inherit}
.btnrow button:active{transform:scale(.97)}
.btnrow button.primary{background:#3b82f6;color:#fff}

.lbCard{display:flex;flex-direction:column;max-height:min(80vh,560px);padding:0}
.lbHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;
  border-bottom:1px solid #f1f5f9;flex:none}
.lbHead b{font-size:16px;color:#1e293b}
.lbHead button{border:none;background:none;font-size:22px;color:#94a3b8;cursor:pointer;line-height:1;padding:2px 8px}
.lbHint{padding:8px 16px 0;font-size:11.5px;color:#94a3b8;flex:none}
#lbList{overflow-y:auto;flex:1;min-height:120px;padding:8px 12px 12px;touch-action:pan-y}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;font-size:14px;color:#334155}
.row.me{background:#eff6ff;border:1px solid #bfdbfe}
.row .rk{width:34px;text-align:center;font-weight:700;color:#64748b;flex:none}
.row:nth-child(1) .rk,.row:nth-child(2) .rk,.row:nth-child(3) .rk{font-size:17px}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm i{font-style:normal;font-size:10.5px;color:#2563eb;border:1px solid #93c5fd;border-radius:5px;
  padding:0 4px;margin-left:4px}
.row .sc{font-weight:700;color:#1e293b;flex:none}
.row .t{font-size:10.5px;color:#94a3b8;flex:none;width:50px;text-align:right}
.empty{padding:26px 10px;text-align:center;color:#94a3b8;font-size:13px;line-height:1.8}
.lbFoot{padding:10px 16px;border-top:1px solid #f1f5f9;font-size:12px;color:#64748b;
  background:#f8fafc;border-radius:0 0 18px 18px;text-align:center;flex:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="nickWrap" class="overlay hidden">
  <div class="card">
    <h2>🏆 起个昵称,上榜冲分!</h2>
    <div class="sub">游戏结束后,你的得分会自动上传到实时排行榜,和其他玩家一起 PK 排名。</div>
    <input id="nickInput" maxlength="12" placeholder="输入昵称(最多12字)" autocomplete="off" enterkeyhint="done">
    <div class="btnrow">
      <button id="nickRandom">🎲 随机</button>
      <button id="nickOk" class="primary">开始游戏</button>
    </div>
  </div>
</div>

<div id="lbWrap" class="overlay hidden">
  <div class="card lbCard">
    <div class="lbHead"><b>🏆 实时排行榜</b><button id="lbClose" aria-label="关闭">×</button></div>
    <div class="lbHint" id="lbHint">加载中…</div>
    <div id="lbList"><div class="empty">加载中…</div></div>
    <div class="lbFoot" id="lbFoot">加载中…</div>
  </div>
</div>

<script>
(function(){
'use strict';

var Engine=Matter.Engine, World=Matter.World, Bodies=Matter.Bodies, Events=Matter.Events;

var W=400, H=700;
var WL=28, WR=28, WB=22;
var GL=WL, GR=W-WR, GW=GR-GL;
var GT=62, GB=H-48;
var DANGER_Y=GT+30;
var DANGER_DELAY=1350;

/* 演示模式: ?demo=1 时从 9/10 级球开始,几次合成即可合成北大 */
var DEMO=/[?&]demo=1/.test(location.search);

var GRAVITY=2.0;
var RESTITUTION=0.1;
var FRICTION=0.08;
var DAMP=0.01;
var DROP_CD=400;
var SPAWN_COUNT=5;

var TIERS=[
  {name:'人大',full:'中国人民大学',  r:13, svg:'ruc.svg',    color:'#c0392b'},
  {name:'同济',full:'同济大学',      r:16, svg:'tongji.svg', color:'#2980b9'},
  {name:'西交',full:'西安交通大学',  r:20, svg:'xjtu.svg',   color:'#d35400'},
  {name:'哈工',full:'哈尔滨工业大学',r:25, svg:'hit.svg',    color:'#2c3e50'},
  {name:'武大',full:'武汉大学',      r:31, svg:'whu.svg',    color:'#8e44ad'},
  {name:'南大',full:'南京大学',      r:39, svg:'nju.svg',    color:'#16a085'},
  {name:'复旦',full:'复旦大学',      r:49, svg:'fdu.svg',    color:'#c0392b'},
  {name:'上交',full:'上海交通大学',  r:61, svg:'sjtu.svg',   color:'#2980b9'},
  {name:'浙大',full:'浙江大学',      r:75, svg:'zju.svg',    color:'#1abc9c'},
  {name:'中科',full:'中国科学技术大学',r:91, svg:'ustc.svg', color:'#2c3e50'},
  {name:'清华',full:'清华大学',      r:109,svg:'thu.svg',    color:'#8e44ad'},
  {name:'北大',full:'北京大学',      r:129,svg:'pku.svg',    color:'#c0392b'}
];
var MT=TIERS.length-1;

var ASSETS=[];
for(var i=0;i<TIERS.length;i++){
  var img=new Image();
  img.src='assets/badges/'+TIERS[i].svg;
  ASSETS.push(img);
}

/* ================= 昵称 & 排行榜 ================= */
/* 云端排行榜: restful-api.dev 匿名对象存储(CORS 全开放,浏览器可直连读写)
   对象: {id, name, data:{scores:[{name,score,dev,ts}]}}
   读取 GET /objects/<id>;写入 PUT /objects/<id>(读→合并→写回,带重试)
   该服务实测: GET/PUT/OPTIONS 预检全部通过 Access-Control-Allow-Origin: * */
var API='https://api.restful-api.dev/objects/ff808181a09d98f701a173c1fdc90911';
var NICK_KEY='hcbd_nick';
var DEV_KEY='hcbd_dev';
var NICK_A=['快乐的','努力的','佛系的','爱睡觉的','北大路的','未名湖的','博雅塔的','图书馆的','燕园的','自习的','卷王的','摸鱼的','干饭的','冲刺的','散步的','爬山的'];
var NICK_B=['猫','鱼','鸭','熊','兔','鹿','狐','鲸','雁','鹰','松鼠','企鹅','熊猫','海豚','考拉','河马'];

function getNick(){return localStorage.getItem(NICK_KEY)||'';}
function setNick(n){n=String(n||'').replace(/\s+/g,' ').trim().slice(0,12);if(n)localStorage.setItem(NICK_KEY,n);return n;}
function getDevice(){
  var d=localStorage.getItem(DEV_KEY);
  if(!d){d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem(DEV_KEY,d);}
  return d;
}
function randNick(){
  var n=NICK_A[Math.floor(Math.random()*NICK_A.length)]+NICK_B[Math.floor(Math.random()*NICK_B.length)];
  return n.slice(0,8);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function fmtTime(ts){
  var d=new Date(ts),p=function(n){return (n<10?'0':'')+n;};
  return p(d.getHours())+':'+p(d.getMinutes());
}

var dev=getDevice();
var nick=getNick();
var pendingRank=0, rankTotal=0, scoreSubmitted=false;
var lbBusy=false, lbTimer=null;

var nickWrap=document.getElementById('nickWrap');
var nickInput=document.getElementById('nickInput');
var lbWrap=document.getElementById('lbWrap');

function openNickModal(){
  nickInput.value=nick;
  nickWrap.classList.remove('hidden');
  setTimeout(function(){try{nickInput.focus();}catch(e){}},60);
}
function saveNickAndStart(){
  var v=nickInput.value.replace(/\s+/g,' ').trim().slice(0,12);
  if(!v)v=randNick();
  setNick(v); nick=v;
  nickWrap.classList.add('hidden');
  if(!started&&!over){started=true;lastDrop=Date.now()-DROP_CD+100;}
}
document.getElementById('nickOk').addEventListener('click',saveNickAndStart);
document.getElementById('nickRandom').addEventListener('click',function(){
  nickInput.value=randNick();try{nickInput.focus();}catch(e){}
});
nickInput.addEventListener('keydown',function(e){if(e.key==='Enter')saveNickAndStart();});

function toggleLB(){
  if(lbWrap.classList.contains('hidden')){lbWrap.classList.remove('hidden');loadLeaderboard();}
  else lbWrap.classList.add('hidden');
}
document.getElementById('lbClose').addEventListener('click',function(){lbWrap.classList.add('hidden');});
lbWrap.addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});

function renderLB(scores){
  var list=document.getElementById('lbList');
  var hint=document.getElementById('lbHint');
  hint.textContent='全网 '+scores.length+' 条成绩 · 每 5 秒自动刷新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  if(!scores.length){
    list.innerHTML='<div class="empty">还没有人上榜,快来抢占第 1 名!🏅<br>叫上朋友一起玩,得分实时比拼</div>';
    return;
  }
  var medals=['🥇','🥈','🥉'];
  var html='';
  for(var i=0;i<scores.length;i++){
    var s=scores[i], me=(s.dev===dev);
    var rk=i<3?medals[i]:String(i+1);
    html+='<div class="row'+(me?' me':'')+'" title="'+esc(new Date(s.ts).toLocaleString('zh-CN',{hour12:false}))+'">'
      +'<span class="rk">'+rk+'</span>'
      +'<span class="nm">'+esc(s.name)+(me?'<i>我</i>':'')+'</span>'
      +'<span class="t">'+fmtTime(s.ts)+'</span>'
      +'<span class="sc">'+s.score+'</span>'
      +'</div>';
  }
  list.innerHTML=html;
}

/* 读取远端对象并排序 */
function loadLeaderboard(){
  fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
    var scores=Array.isArray(data)?data:(data&&Array.isArray(data.data)&&Array.isArray(data.data.scores)?data.data.scores:[]);
    scores=scores.filter(function(s){return s&&s.name&&(s.score|0)>0;});
    scores.sort(function(a,b){return (b.score-a.score)||(a.ts-b.ts);});
    scores=scores.slice(0,50);
    renderLB(scores);
    var myBest=0,myRank=0;
    for(var i=0;i<scores.length;i++){
      if(scores[i].dev===dev&&scores[i].score>myBest){myBest=scores[i].score;myRank=i+1;}
    }
    document.getElementById('lbFoot').textContent=myBest
      ?('我的最高分: '+myBest+' · 全网第 '+myRank+' 名')
      :'还没有你的成绩,上榜冲分吧!';
  }).catch(function(){});
}

/* 写入: 读取→合并→排序→写回,带重试;单玩家连续写有防抖 */
function submitScore(){
  if(DEMO) return; /* 演示模式不污染真实排行榜 */
  if(scoreSubmitted||score<=0)return;
  scoreSubmitted=true;
  var entry={name:nick,score:score,dev:dev,ts:Date.now()};
  var attempt=function(tries){
    if(tries<=0)return;
    fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){
      var scores=Array.isArray(data)?data:(data&&Array.isArray(data.data)&&Array.isArray(data.data.scores)?data.data.scores:[]);
      scores=scores.filter(function(s){return s&&s.name&&(s.score|0)>0;});
      scores.push(entry);
      scores.sort(function(a,b){return (b.score-a.score)||(a.ts-b.ts);});
      scores=scores.slice(0,200);
      return fetch(API,{method:'PUT',headers:{'Content-Type':'application/json;charset=UTF-8'},
        body:JSON.stringify({name:'合成北大排行榜',data:{scores:scores}})}).then(function(r2){
        if(r2.ok){pendingRank=scores.indexOf(entry)+1;rankTotal=scores.length;loadLeaderboard();}
        else return attempt(tries-1);
      });
    }).catch(function(){setTimeout(function(){attempt(tries-1);},800);});
  };
  attempt(4);
}
setInterval(loadLeaderboard,5000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)loadLeaderboard();});

/* ================= 游戏本体 ================= */

var cv=document.getElementById('c');
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr; cv.height=H*dpr;
var ctx=cv.getContext('2d');
ctx.scale(dpr,dpr);

function resizeCSS(){
  var ratio=W/H, ww=window.innerWidth, wh=window.innerHeight;
  var cw,ch;
  if(ww/wh>ratio){ch=Math.min(wh,H);cw=ch*ratio;}
  else{cw=Math.min(ww,W);ch=cw/ratio;}
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
}
resizeCSS(); window.addEventListener('resize',resizeCSS);

var engine=Engine.create({gravity:{x:0,y:GRAVITY}});
var world=engine.world;

World.add(world,Bodies.rectangle(GL-WL/2,(GT+GB)/2,WL,GB-GT+200,
  {isStatic:true,friction:0.3,render:{visible:false}}));
World.add(world,Bodies.rectangle(GR+WR/2,(GT+GB)/2,WR,GB-GT+200,
  {isStatic:true,friction:0.3,render:{visible:false}}));
World.add(world,Bodies.rectangle(W/2,GB+WB/2,GW+WL*2,WB,
  {isStatic:true,friction:0.5,render:{visible:false}}));

var score=0, best=+localStorage.getItem('hcbd_hi')||0;
var cur=rndT(), nxt=rndT();
var aimX=W/2, canDrop=true, lastDrop=0;
var started=false, over=false;
var balls=[], parts=[];
var shkT=0, shkI=0;
var maxReached=0;
var dangerTimer=0, dangerNear=false;
var mergeQueue=[];

function rndT(){
  if(DEMO){
    /* 演示模式: 等级分布 0:0, 1-8:0, 9-10 各 25%, 11 50% */
    var r=Math.random();
    if(r<0.5) return 11;      /* 清华 */
    if(r<0.75) return 10;     /* 中科 */
    if(r<0.9) return 9;       /* 浙大 */
    return 8;                 /* 上交 */
  }
  return Math.floor(Math.random()*SPAWN_COUNT);
}

Events.on(engine,'collisionStart',function(ev){
  for(var i=0;i<ev.pairs.length;i++){
    var a=ev.pairs[i].bodyA, b=ev.pairs[i].bodyB;
    if(a.plugin.tier!==undefined && b.plugin.tier!==undefined
       && a.plugin.tier===b.plugin.tier && a.plugin.tier<MT
       && !a.plugin.merging && !b.plugin.merging){
      a.plugin.merging=true; b.plugin.merging=true;
      mergeQueue.push({a:a,b:b});
    }
  }
});

function processQueue(){
  for(var i=0;i<mergeQueue.length;i++){
    var p=mergeQueue[i];
    if(!p.a.plugin.alive||!p.b.plugin.alive) continue;
    if(p.a.plugin.tier!==p.b.plugin.tier) continue;
    var tier=p.a.plugin.tier;
    if(tier>=MT) continue;
    var nt=tier+1;
    var mx=(p.a.position.x+p.b.position.x)/2;
    var my=(p.a.position.y+p.b.position.y)/2;
    World.remove(world,p.a); World.remove(world,p.b);
    p.a.plugin.alive=false; p.b.plugin.alive=false;
    rmBall(p.a); rmBall(p.b);
    spawn(mx,my,nt);
    score+=(nt+1)*10;
    if(nt>maxReached) maxReached=nt;
    boom(mx,my,TIERS[nt].color,14);
    if(nt===MT){boom(mx,my,'#fbbf24',50);boom(mx,my,'#ef4444',35);}
    else{shkT=100;shkI=Math.min((nt+1)*1.2,6);}
  }
  mergeQueue=[];
}

function rmBall(b){for(var i=0;i<balls.length;i++) if(balls[i].body===b){balls.splice(i,1);return;}}

function spawn(x,y,t){
  var d=TIERS[t];
  var b=Bodies.circle(x,y,d.r,{
    restitution:RESTITUTION,friction:FRICTION,frictionAir:DAMP,
    density:0.0015,label:'ball',
    plugin:{tier:t,alive:true,merging:false}
  });
  World.add(world,b);
  balls.push({body:b,tier:t,born:Date.now()});
  return b;
}

function boom(x,y,c,n){
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n+Math.random()*.4, s=2+Math.random()*4;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
      life:1,dc:.018+Math.random()*.02,c:c,sz:2+Math.random()*4});
  }
}
function tickParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.12; p.life-=p.dc;
    if(p.life<=0) parts.splice(i,1);
  }
}

function drop(){
  if(!canDrop||over||!started) return;
  var now=Date.now(); if(now-lastDrop<DROP_CD) return;
  var r=TIERS[cur].r;
  var x=Math.max(GL+r+4,Math.min(GR-r-4,aimX));
  spawn(x,GT+r+4,cur);
  lastDrop=now; canDrop=false;
  setTimeout(function(){
    if(!over){cur=nxt;nxt=rndT();canDrop=true;}
  },DROP_CD);
}

/* 演示模式: 自动播放,持续瞄准落点 */
if(DEMO){
  setInterval(function(){
    if(!started||over) return;
    /* 扫描一个空隙列,投到最左边或最右边,让同级球尽量相邻 */
    var best=-1,bestGap=-1;
    for(var col=0;col<3;col++){
      var cx=GL+30+(GR-GL-60)*col/2;
      var maxY=GT;
      for(var i=0;i<balls.length;i++){
        var b=balls[i];
        if(Math.abs(b.body.position.x-cx)<TIERS[b.tier].r+8){
          if(b.body.position.y>maxY) maxY=b.body.position.y;
        }
      }
      var gap=(GB-maxY);
      if(gap>bestGap){bestGap=gap;best=cx;}
    }
    if(best>0) aimX=best;
    drop();
  },460);
}

function toCanvasX(cx){var rc=cv.getBoundingClientRect();return(cx-rc.left)/rc.width*W;}
function toCanvasY(cy){var rc=cv.getBoundingClientRect();return(cy-rc.top)/rc.height*H;}

function inLbBtn(cx,cy){return cx>=W-48&&cx<=W-4&&cy>=6&&cy<=34;}
function inNickEdit(cx,cy){return cx>W/2-110&&cx<W/2+110&&cy>H/2+50&&cy<H/2+80;}

cv.addEventListener('mousemove',function(e){aimX=toCanvasX(e.clientX);});
cv.addEventListener('click',function(e){
  var cx=toCanvasX(e.clientX), cy=toCanvasY(e.clientY);
  if(inLbBtn(cx,cy)){toggleLB();return;}
  if(!started){
    if(inNickEdit(cx,cy)){openNickModal();return;}
    started=true;lastDrop=Date.now()-DROP_CD+100;return;
  }
  if(over){checkRestart(e.clientX,e.clientY);return;}
  drop();
});
cv.addEventListener('touchstart',function(e){
  e.preventDefault(); aimX=toCanvasX(e.touches[0].clientX);
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault(); aimX=toCanvasX(e.touches[0].clientX);
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  var t=e.changedTouches[0];
  var cx=toCanvasX(t.clientX), cy=toCanvasY(t.clientY);
  if(inLbBtn(cx,cy)){toggleLB();return;}
  if(!started){
    if(inNickEdit(cx,cy)){openNickModal();return;}
    started=true;lastDrop=Date.now()-DROP_CD+100;return;
  }
  if(over){checkRestart(t.clientX,t.clientY);return;}
  drop();
},{passive:false});

function checkRestart(cx,cy){
  var mx=toCanvasX(cx), my=toCanvasY(cy);
  if(mx>W/2-55&&mx<W/2+55&&my>H/2+60&&my<H/2+98) doRestart();
}

function doRestart(){
  for(var i=0;i<balls.length;i++) World.remove(world,balls[i].body);
  balls=[]; parts=[]; mergeQueue=[];
  score=0; over=false; canDrop=true; lastDrop=Date.now();
  cur=rndT(); nxt=rndT(); maxReached=0;
  started=true; dangerTimer=0; dangerNear=false;
  scoreSubmitted=false; pendingRank=0;
}

function update(dt){
  if(over) return;
  Engine.update(engine,dt);
  processQueue();
  for(var i=balls.length-1;i>=0;i--){
    var b=balls[i];
    if(!b.body.plugin.alive){balls.splice(i,1);continue;}
    if(b.body.position.y>GB+200||b.body.position.x<-200||b.body.position.x>W+200){
      World.remove(world,b.body); balls.splice(i,1);
    }
  }
  dangerNear=false;
  var now=Date.now();
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(now-b.born<720) continue;
    var vx=b.body.velocity.x, vy=b.body.velocity.y;
    var spd=Math.sqrt(vx*vx+vy*vy);
    if(spd<0.5){
      if(b.body.position.y-TIERS[b.tier].r<DANGER_Y){
        dangerNear=true; break;
      }
    }
  }
  if(dangerNear){
    dangerTimer+=dt;
    if(dangerTimer>=DANGER_DELAY){
      over=true;
      if(score>best){best=score;localStorage.setItem('hcbd_hi',best);}
      submitScore();
    }
  }else{
    dangerTimer=Math.max(0,dangerTimer-dt*2);
  }
  tickParts();
  if(shkT>0) shkT-=dt;
}

function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function lighten(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+((255-r)*pct/100|0));
  g=Math.min(255,g+((255-g)*pct/100|0));
  b=Math.min(255,b+((255-b)*pct/100|0));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}
function darken(hex,pct){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-(r*pct/100|0));
  g=Math.max(0,g-(g*pct/100|0));
  b=Math.max(0,b-(b*pct/100|0));
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

function drawBall(c,x,y,ti,sc,al){
  var d=TIERS[ti], r=d.r*(sc||1);
  c.save(); c.globalAlpha=al==null?1:al;
  c.beginPath();c.arc(x+2,y+3,r,0,Math.PI*2);
  c.fillStyle='rgba(0,0,0,.10)';c.fill();

  var img=ASSETS[ti];
  if(img && img.complete && img.naturalWidth>0){
    c.save();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.clip();
    c.drawImage(img,x-r,y-r,r*2,r*2);
    c.restore();
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);
    c.strokeStyle=d.color;c.lineWidth=2.5;c.stroke();
  }else{
    var g=c.createRadialGradient(x-r*.3,y-r*.3,r*.05,x,y,r);
    g.addColorStop(0,lighten(d.color,30));g.addColorStop(1,d.color);
    c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=g;c.fill();
    c.strokeStyle=darken(d.color,20);c.lineWidth=2;c.stroke();
    c.fillStyle='#fff';
    c.font='bold '+Math.max(r*.65,10)+'px "PingFang SC","Microsoft YaHei",sans-serif';
    c.textAlign='center';c.textBaseline='middle';
    c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=2;
    c.fillText(d.name,x,y+1);
    c.shadowColor='transparent';
  }
  c.restore();
}

function render(c){
  c.save();
  if(shkT>0) c.translate((Math.random()-.5)*shkI*2,(Math.random()-.5)*shkI*2);

  c.fillStyle='#f0f9ff'; c.fillRect(0,0,W,H);

  c.fillStyle='rgba(224,242,254,.45)';
  c.fillRect(GL,GT,GW,GB-GT);
  c.strokeStyle='rgba(147,197,253,.12)';c.lineWidth=1;
  for(var y=GT;y<GB;y+=22){c.beginPath();c.moveTo(GL,y);c.lineTo(GR,y);c.stroke();}

  c.save();c.setLineDash([6,4]);
  c.strokeStyle=dangerNear?'rgba(239,68,68,.8)':'rgba(239,68,68,.4)';
  c.lineWidth=dangerNear?2:1.5;
  c.beginPath();c.moveTo(GL,DANGER_Y);c.lineTo(GR,DANGER_Y);c.stroke();c.setLineDash([]);
  c.fillStyle=dangerNear?'rgba(239,68,68,.8)':'rgba(239,68,68,.45)';
  c.font='10px sans-serif';c.textAlign='left';c.textBaseline='bottom';
  c.fillText('\u26A0 \u5371\u9669\u7EBF',GL+4,DANGER_Y-2);
  if(dangerNear && dangerTimer>0){
    var tw=(dangerTimer/DANGER_DELAY)*(GR-GL-20);
    c.fillStyle='rgba(239,68,68,.3)';
    c.fillRect(GL+10,DANGER_Y+4,tw,4);
  }
  c.restore();

  var wg=c.createLinearGradient(0,GT,0,GB);
  wg.addColorStop(0,'#60a5fa');wg.addColorStop(1,'#2563eb');
  c.fillStyle=wg;
  c.fillRect(0,GT-4,WL+2,GB-GT+WB+8);
  c.fillRect(GR-1,GT-4,WR+2,GB-GT+WB+8);
  c.fillRect(GL-2,GB,GW+4,WB+4);
  c.fillStyle='rgba(255,255,255,.18)';
  c.fillRect(GL-1,GT,2,GB-GT);
  c.fillRect(GR-1,GT,2,GB-GT);
  c.fillStyle='rgba(0,0,0,.08)';
  c.fillRect(0,GT-4,2,GB-GT+WB+8);
  c.fillRect(W-2,GT-4,2,GB-GT+WB+8);
  c.fillRect(0,GB+WB+2,W,2);

  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(!b.body.plugin.alive) continue;
    drawBall(c,b.body.position.x,b.body.position.y,b.tier);
  }

  for(var i=0;i<parts.length;i++){
    var p=parts[i]; c.globalAlpha=p.life; c.fillStyle=p.c;
    c.beginPath();c.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);c.fill();
  }
  c.globalAlpha=1;

  if(canDrop&&!over&&started){
    var d=TIERS[cur], px=Math.max(GL+d.r+4,Math.min(GR-d.r-4,aimX));
    c.save();c.setLineDash([4,4]);c.strokeStyle='rgba(100,116,139,.25)';c.lineWidth=1;
    c.beginPath();c.moveTo(px,GT);c.lineTo(px,GB);c.stroke();c.setLineDash([]);c.restore();
    drawBall(c,px,GT+d.r+4,cur,1,.5);
    c.fillStyle='rgba(100,116,139,.45)';
    c.beginPath();c.moveTo(px-7,GT-1);c.lineTo(px+7,GT-1);c.lineTo(px,GT+9);c.closePath();c.fill();
  }

  c.fillStyle='#1e293b';c.font='bold 22px sans-serif';c.textAlign='left';c.textBaseline='top';
  c.fillText('\u5F97\u5206: '+score,12,8);
  c.fillStyle='#64748b';c.font='13px sans-serif';
  c.fillText('\u6700\u9AD8: '+best,12,34);
  c.fillStyle='#94a3b8';c.font='11px sans-serif';c.textAlign='right';
  c.fillText('\u5408\u6210\u76EE\u6807 \u2192 \u5317\u5927',W-58,8);
  c.fillStyle=TIERS[cur].color;c.font='bold 13px sans-serif';
  c.fillText('\u5F53\u524D: '+TIERS[cur].full,W-58,24);

  /* 排行榜按钮 */
  c.fillStyle='rgba(255,255,255,.88)';rr(c,W-48,6,44,28,14);c.fill();
  c.strokeStyle='rgba(100,116,139,.3)';c.lineWidth=1;rr(c,W-48,6,44,28,14);c.stroke();
  c.fillStyle='#1e293b';c.font='12px sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.fillText('\uD83C\uDFC6 \u699C',W-26,21);

  c.fillStyle='#475569';c.font='12px sans-serif';c.textAlign='left';c.textBaseline='middle';
  c.fillText('\u4E0B\u4E00\u4E2A:',12,54);
  drawBall(c,72,54,nxt,.45,1);

  var bx=110,by=H-38,bw=W-bx-12,bh=14;
  c.fillStyle='rgba(0,0,0,.06)';rr(c,bx,by,bw,bh,7);c.fill();
  var prog=Math.min(score/2000,1);
  if(prog>0){c.fillStyle='rgba(96,165,250,.5)';rr(c,bx,by,bw*prog,bh,7);c.fill();}
  for(var i=0;i<TIERS.length;i++){
    var tx=bx+bw*(i/(TIERS.length-1));
    c.beginPath();c.arc(tx,by+bh/2,3,0,Math.PI*2);
    c.fillStyle=i<=maxReached?TIERS[i].color:'#cbd5e1';c.fill();
    c.strokeStyle='#fff';c.lineWidth=1;c.stroke();
  }

  if(!started){
    c.fillStyle='rgba(255,255,255,.92)';rr(c,35,H/2-140,W-70,280,18);c.fill();
    c.strokeStyle='rgba(0,0,0,.06)';c.lineWidth=1;rr(c,35,H/2-140,W-70,280,18);c.stroke();
    c.fillStyle='#1e293b';c.font='bold 36px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('\u5408\u6210\u5317\u5927',W/2,H/2-90);
    c.fillStyle='#64748b';c.font='15px sans-serif';
    c.fillText('\u79FB\u52A8\u7784\u51C6 \u00B7 \u70B9\u51FB\u6295\u63B7',W/2,H/2-45);
    c.fillText('\u76F8\u540C\u5B66\u6821\u78B0\u649E\u5373\u5408\u6210\u5347\u7EA7',W/2,H/2-20);
    c.fillText('12\u4E2A\u7B49\u7EA7 \u00B7 \u771F\u5B9E\u6821\u5FBD',W/2,H/2+5);
    var py=H/2+40;
    var startX=W/2-(TIERS.length-1)*14;
    for(var i=0;i<TIERS.length;i++) drawBall(c,startX+i*28,py,i,.35,1);
    c.fillStyle='#64748b';c.font='13px sans-serif';
    c.fillText('\u6635\u79F0: '+nick+' \u00B7 \u70B9\u51FB\u4FEE\u6539',W/2,H/2+62);
    c.fillStyle='#3b82f6';c.font='bold 17px sans-serif';
    c.fillText('\u70B9\u51FB\u5F00\u59CB',W/2,H/2+95);
  }

  if(over){
    c.fillStyle='rgba(15,23,42,.72)';c.fillRect(GL,GT,GW,GB-GT);
    c.fillStyle='rgba(255,255,255,.95)';rr(c,55,H/2-115,W-110,240,16);c.fill();
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='#ef4444';c.font='bold 26px sans-serif';
    c.fillText('\u6E38\u620F\u7ED3\u675F',W/2,H/2-75);
    c.fillStyle='#334155';c.font='bold 22px sans-serif';
    c.fillText('\u5F97\u5206: '+score,W/2,H/2-35);
    if(score>=best&&score>0){
      c.fillStyle='#f59e0b';c.font='bold 15px sans-serif';
      c.fillText('\uD83C\uDFC6 \u65B0\u7EAA\u5F55\uFF01',W/2,H/2-5);
    }else{
      c.fillStyle='#64748b';c.font='14px sans-serif';
      c.fillText('\u6700\u9AD8: '+best,W/2,H/2-5);
    }
    if(maxReached>0){
      c.fillStyle='#64748b';c.font='13px sans-serif';
      c.fillText('\u6700\u9AD8\u5408\u6210: '+TIERS[maxReached].full,W/2,H/2+22);
    }
    if(pendingRank>0){
      c.fillStyle='#0284c7';c.font='bold 14px sans-serif';
      c.fillText('\u5168\u7F51\u6392\u540D: \u7B2C '+pendingRank+' \u540D / '+rankTotal+' \u4EBA',W/2,H/2+44);
    }else if(score>0){
      c.fillStyle='#94a3b8';c.font='13px sans-serif';
      c.fillText('\u6210\u7EE9\u4E0A\u4F20\u4E2D\u2026',W/2,H/2+44);
    }
    c.fillStyle='#3b82f6';rr(c,W/2-55,H/2+60,110,38,10);c.fill();
    c.fillStyle='#fff';c.font='bold 15px sans-serif';
    c.fillText('\u518D\u6765\u4E00\u6B21',W/2,H/2+79);
  }

  c.restore();
}

var lastT=performance.now();
function loop(t){
  if(loopRunning) return;
  loopRunning = true;
  var dt=Math.min(t-lastT,32); lastT=t;
  update(dt); render(ctx);
  loopRunning = false;
  if(document.hidden) {
    setTimeout(function(){ loop(performance.now()); }, 16);
  } else {
    requestAnimationFrame(loop);
  }
}
var loopRunning = false;
if(document.hidden) {
  setTimeout(function(){ loop(performance.now()); }, 16);
} else {
  requestAnimationFrame(loop);
}

loadLeaderboard();
if(!getNick()) setTimeout(openNickModal,400);

})();
</script>
